<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>WrdGms | Free English Games for Teachers</title>
    <meta name="description" content="Free, high-energy classroom games for English teachers. Interactive spelling bees, prefix puzzles, and vocabulary challenges.">
    
    <style>
        body {
            background-color: #fcfcfc; /* Very slight off-white for a premium feel */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Improved Tagline Design */
        .seo-intro {
            text-align: center;
            margin-bottom: 60px;
            padding: 0 20px;
        }

        .tagline {
            display: inline-block;
            background: #ffffff;
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .tagline p {
            color: #444;
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            word-spacing: 4px;
        }

        .tagline strong {
            color: #000;
            font-weight: 800;
        }

        .hub-container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .game-tablet {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-tablet:hover {
            transform: translateY(-12px); /* Lift up instead of just scaling */
        }

        .logo-box {
            width: 400px;
            height: 250px;
            border-radius: 24px; /* Slightly rounder for a modern look */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid #f0f0f0;
            background: #fff;
            padding: 30px;
            box-sizing: border-box;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .game-label {
            margin-top: 20px;
            color: #111;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .coffee-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header class="seo-intro">
        <div class="tagline">
            <p>Free, <strong>High-Energy</strong> Games for English Teachers</p>
        </div>
    </header>

    <main class="hub-container">
        <a href="/prefix/index.html" class="game-tablet">
            <div class="logo-box">
                <img src="prefix/logo.png" alt="Prefix Puzzle">
            </div>
            <div class="game-label">Prefix Puzzle</div>
        </a>

        <a href="/9letters/index.html" class="game-tablet">
            <div class="logo-box">
                <img src="9letters/logo.png" alt="9 Letters">
            </div>
            <div class="game-label">9 Letters</div>
        </a>

        <a href="/spelling/host.html" class="game-tablet">
            <div class="logo-box">
                <img src="/spelling/spellit-logo.png" alt="Spell It">
            </div>
            <div class="game-label">Spell It</div>
        </a>
    </main>

    <div class="coffee-container">
        <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="robinbagon" data-color="#FFDD00" data-emoji="☕" data-font="Bree" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff"></script>
    </div>

</body>
</html>
